# On-demand Claude reviews of pull requests.
#
# Mention @claude in a PR comment, an inline review comment, or a submitted
# review and Claude answers on the PR. Add `model=<name>` to pick the model
# (`opus`, `sonnet`, `haiku`, `fable` for Fable 5.2, or a full model id); the
# default is `opus`.
#
# Runs authenticate with a Claude subscription token stored in the
# CLAUDE_CODE_OAUTH_TOKEN repo secret. The token is created with
# `claude setup-token`, and runs count against that subscription's usage
# limits.
#
# Reviews do not run the tests themselves (that would run PR code next to the
# credentials); they read the results of the CI workflow instead.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Three gates, all required:
    # 1. Only people on the allow-list can spend the subscription usage. To add
    #    someone, extend the list, e.g.
    #      contains(fromJSON('["sraja7272", "another-user"]'), github.actor)
    #    (they also need write access to the repo; the action checks that too).
    # 2. issue_comment also fires on plain issues; only run for pull requests.
    #    The two review events only ever come from pull requests.
    # 3. The comment or review mentions @claude.
    if: >-
      contains(fromJSON('["sraja7272", "TIbrahim99"]'), github.actor) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      contains(github.event.comment.body || github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # OIDC token the action exchanges for its GitHub App token
      actions: read # with additional_permissions below, lets Claude read CI results
    steps:
      # The action fetches the PR branch itself (depth = PR commit count, min 20),
      # so a shallow checkout is enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The comment text arrives through an env var, never interpolated into the
      # script. Only [a-z0-9.-] survives, and the name must start with a letter
      # or digit so it can't be read as another CLI flag.
      - name: Pick model
        id: model
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          MODEL=$(printf '%s' "$BODY" | grep -oiP 'model=\K[a-z0-9][a-z0-9.-]*' | head -n1 | tr '[:upper:]' '[:lower:]' || true)
          # The CLI's own `fable` alias points at an older model, so pin the current id.
          if [ "$MODEL" = "fable" ]; then MODEL=claude-fable-5-2; fi
          echo "name=${MODEL:-opus}" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.240 (v1)
        with:
          # Subscription token from `claude setup-token`, stored in the
          # CLAUDE_CODE_OAUTH_TOKEN repo secret; runs count against that Claude
          # subscription's usage limits. Not an API key: the API credit included
          # with a Claude subscription does not cover runs started by this
          # action, which then fail with "Credit balance is too low".
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job's `actions: read` grant alone is not enough: the action adds
          # its CI tools (get_ci_status, get_workflow_run_details,
          # download_job_log) only when this input asks for it.
          additional_permissions: |
            actions: read
          # Prints Claude's full output, tool results included, into the Actions
          # log to diagnose failed runs. Anyone who can see this repo's Actions
          # can read those logs, so turn it off once the failure is understood.
          show_full_output: true
          claude_args: >-
            --model ${{ steps.model.outputs.name }}
            --append-system-prompt "Before reviewing a pull request, check the CI results for its head commit with the github_ci tools. Start the review with one line giving the CI gate result and any failing job. Quote failing test names from the job log; do not guess."
